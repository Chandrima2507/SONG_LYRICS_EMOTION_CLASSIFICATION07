<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmoLyrics - Song Lyrics Mood Classification Platform</title>
    <meta http-equiv="refresh" content="1; url=http://localhost:5000/" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background: #09090b;
        color: #f4f4f5;
        font-family: 'Manrope', -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(24, 24, 27, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 40px;
        text-align: center;
        max-width: 480px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-family: 'Outfit', sans-serif;
        font-size: 2rem;
        margin: 12px 0 8px;
        background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        color: #a1a1aa;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        background: #ffffff;
        color: #000000;
        font-weight: 700;
        font-family: 'Outfit', sans-serif;
        padding: 14px 28px;
        border-radius: 14px;
        text-decoration: none;
        transition: transform 0.2s, background 0.2s;
      }
      .btn:hover {
        background: #e4e4e7;
        transform: translateY(-2px);
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(0,0,0,0.2);
        border-top-color: #000;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 3rem;">✨</div>
      <h1>EmoLyrics Production</h1>
      <p>Redirecting you to the live application running on your local server...</p>
      <a href="http://localhost:5000/" class="btn">
        <span class="spinner"></span> Open http://localhost:5000
      </a>
    </div>
  </body>
</html>
